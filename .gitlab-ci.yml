# =============================================================================
# Fichier     : .gitlab-ci.yml
# Rôle        : pipeline GitLab CI GÉNÉRIQUE, identique dans les deux dépôts
#               (API Spring Boot et front Angular). Chaque job ne se lance que
#               si les fichiers de son type de projet existent (rules: exists).
# Étapes      : test → build (image(s) Docker) → security (hadolint, trivy)
#               → release (semantic-release)
# Utilise     : scripts/run-tests.sh, scripts/smoke-test.sh, .releaserc.yml
#               (+ scripts/release.py), .trivyignore (API), variable CI/CD
#               GITLAB_TOKEN
# =============================================================================

# Images utilisées, centralisées ici pour changer une version en une ligne
# (images Debian/Ubuntu : Bash est requis par run-tests.sh)
variables:
  JDK_IMAGE: "eclipse-temurin:21-jdk"
  NODE_IMAGE: "node:24-bookworm-slim"
  # Client Docker et démon Docker-in-Docker (même version majeure)
  DOCKER_IMAGE: "docker:29"
  DIND_IMAGE: "docker:29-dind"
  # Outils de sécurité, versions fixées (même résultat à chaque pipeline)
  HADOLINT_IMAGE: "hadolint/hadolint:v2.14.0-alpine"
  TRIVY_IMAGE: "aquasec/trivy:0.75.0"

# Déclenchement : sur chaque push de branche, sur les merge requests et sur
# les étiquettes de version, sans doublon (règles lues dans l'ordre, la
# première qui correspond décide)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Commit de version poussé par semantic-release : pas de pipeline de
    # branche, son étiquette vX.Y.Z lance déjà le sien (règle suivante)
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    - if: $CI_COMMIT_BRANCH
    # Étiquette de version (ex. v1.2.3) : construit l'image 1.2.3 et latest
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - test
  - build
  - security
  - release

# ---------- Modèle commun aux jobs de test (nom en "." = non lancé seul) ----
.test:
  stage: test
  script:
    - ./scripts/run-tests.sh
  # Rapports conservés MÊME en cas d'échec : c'est là qu'on en a besoin
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
    # Lu par GitLab : résultats affichés dans l'onglet Tests et dans la MR
    reports:
      junit: test-results/*.xml

# ---------- API Spring Boot : seulement si le dépôt contient gradlew ----------
test:spring-boot:
  extends: .test
  image: $JDK_IMAGE
  # Gradle range ses téléchargements dans le projet pour pouvoir les cacher
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Cache réutilisé tant que les dépendances et la version de Gradle
  # ne changent pas
  cache:
    key:
      files:
        - build.gradle
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/wrapper
      - .gradle/caches
  rules:
    - exists:
        - gradlew

# ---------- Front Angular : seulement si le dépôt contient angular.json -------
test:angular:
  extends: .test
  image: $NODE_IMAGE
  variables:
    # Chromium installé ci-dessous, utilisé par Karma (via run-tests.sh)
    CHROME_BIN: /usr/bin/chromium
    # npm range ses téléchargements dans le projet pour pouvoir les cacher
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Cache réutilisé tant que package-lock.json ne change pas
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  # L'image Node ne contient pas de navigateur : on installe Chromium
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends chromium > /dev/null
  rules:
    - exists:
        - angular.json

# ---------- Modèle commun : construire, tester et publier UNE image ---------
# (nom en "." = non lancé seul ; utilisé par build:image et build:db-image)
.build-image:
  stage: build
  # Client Docker + démon Docker-in-Docker lancé à côté, sous le nom "docker"
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
  variables:
    # Communication chiffrée (TLS) entre le client et le démon Docker
    DOCKER_TLS_CERTDIR: "/certs"
    # Valeurs par défaut (image de l'application) ; un job peut les changer :
    # dossier à construire, adresse de l'image, type de smoke test
    BUILD_CONTEXT: "."
    IMAGE_PATH: "$CI_REGISTRY_IMAGE"
    SMOKE_KIND: "app"
  before_script:
    # smoke-test.sh est écrit en Bash, absent de l'image docker (Alpine)
    - apk add --no-cache bash > /dev/null
    # Connexion au registre avec les identifiants temporaires fournis par
    # GitLab ; --password-stdin : le mot de passe n'apparaît pas dans les logs
    - echo "$CI_REGISTRY_PASSWORD"
      | docker login --username "$CI_REGISTRY_USER"
      --password-stdin "$CI_REGISTRY"
  script:
    # Deux tags pour la même image : l'un FIXE, l'autre MOBILE
    # - branche : SHA court (fixe) + nom de branche "nettoyé" (mobile)
    # - étiquette v1.2.3 : 1.2.3 (fixe) + latest (mobile) ;
    #   ${CI_COMMIT_TAG#v} retire le "v" du début
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_FIXED="$IMAGE_PATH:${CI_COMMIT_TAG#v}"
        IMAGE_MOVING="$IMAGE_PATH:latest"
      else
        IMAGE_FIXED="$IMAGE_PATH:$CI_COMMIT_SHORT_SHA"
        IMAGE_MOVING="$IMAGE_PATH:$CI_COMMIT_REF_SLUG"
      fi
    - docker build --pull --tag "$IMAGE_FIXED" --tag "$IMAGE_MOVING"
      "$BUILD_CONTEXT"
    # L'image doit démarrer et répondre AVANT d'être publiée
    - ./scripts/smoke-test.sh "$IMAGE_FIXED" "$SMOKE_KIND"
    - docker push "$IMAGE_FIXED"
    - docker push "$IMAGE_MOVING"
  # Déconnexion du registre en fin de job (même en cas d'échec) :
  # le jeton ne reste pas stocké dans le conteneur
  after_script:
    - docker logout "$CI_REGISTRY"

# ---------- Image de l'application (les deux dépôts) ----------
build:image:
  extends: .build-image
  # Sur les pipelines de branche et d'étiquette (pas en double sur la MR)
  # et si le dépôt contient un Dockerfile
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      exists:
        - Dockerfile

# ---------- Image PostgreSQL sans gosu (API seulement) ----------
build:db-image:
  extends: .build-image
  # Même modèle, autre dossier, autre adresse : .../<projet>/postgres:<tag>
  variables:
    BUILD_CONTEXT: "database"
    IMAGE_PATH: "$CI_REGISTRY_IMAGE/postgres"
    SMOKE_KIND: "postgres"
  # Seulement si le dépôt contient database/Dockerfile (donc pas le front)
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      exists:
        - database/Dockerfile

# ---------- Sécurité : lint des Dockerfiles (bonnes pratiques) ----------
security:hadolint:
  stage: security
  image: $HADOLINT_IMAGE
  # needs vide : n'attend pas la fin du build, démarre tout de suite
  needs: []
  script:
    # Code 1 (job rouge) à la moindre remarque ; database/ : API seulement
    - hadolint Dockerfile
    - if [ -f database/Dockerfile ]; then hadolint database/Dockerfile; fi
  # Sur tous les pipelines (branche, MR, étiquette) s'il y a un Dockerfile
  rules:
    - exists:
        - Dockerfile

# ---------- Sécurité : scan de l'image publiée (modèle commun) ----------
# Bloque si une faille CRITICAL est trouvée (sauf dérogation datée listée
# dans .trivyignore) ; les failles HIGH sont seulement listées
.trivy-scan:
  stage: security
  image:
    name: $TRIVY_IMAGE
    # L'image lance "trivy" d'office : on vide ce point d'entrée pour que
    # GitLab puisse exécuter les lignes de script
    entrypoint: [""]
  variables:
    IMAGE_PATH: "$CI_REGISTRY_IMAGE"
    # Identifiants temporaires du job, pour LIRE l'image privée du registre
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    # Base des failles gardée en cache d'un pipeline à l'autre
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    # Même tag FIXE que celui publié par le build
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE="$IMAGE_PATH:${CI_COMMIT_TAG#v}"
      else
        IMAGE="$IMAGE_PATH:$CI_COMMIT_SHORT_SHA"
      fi
    # 1. Rapport HIGH + CRITICAL, sans bloquer (code 0), gardé en artefact
    - trivy image --exit-code 0 --severity HIGH,CRITICAL
      --output "trivy-$CI_JOB_NAME_SLUG.txt" "$IMAGE"
    - cat "trivy-$CI_JOB_NAME_SLUG.txt"
    # 2. Verdict : code 1 (job rouge) s'il reste une faille CRITICAL
    - trivy image --exit-code 1 --severity CRITICAL --skip-db-update
      "$IMAGE"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  # Rapport conservé même si le job échoue : c'est là qu'on en a besoin
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-*.txt

# ---------- Scan de l'image de l'application (les deux dépôts) ----------
security:trivy:
  extends: .trivy-scan
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      exists:
        - Dockerfile

# ---------- Scan de l'image PostgreSQL (API seulement) ----------
security:trivy-db:
  extends: .trivy-scan
  variables:
    IMAGE_PATH: "$CI_REGISTRY_IMAGE/postgres"
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      exists:
        - database/Dockerfile

# ---------- Release : version, changelog, étiquette, Release GitLab ---------
release:
  stage: release
  image: $NODE_IMAGE
  variables:
    # Historique git COMPLET : semantic-release relit tous les commits depuis
    # la dernière étiquette (GitLab n'en récupère qu'une partie par défaut)
    GIT_DEPTH: "0"
  before_script:
    # git (commit + étiquette) et python3 (scripts/release.py)
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
      git python3 ca-certificates > /dev/null
    # Versions ÉPINGLÉES : même résultat à chaque release
    # (conventional-changelog-conventionalcommits 10.x est incompatible)
    - npm install --global --no-audit --no-fund
      semantic-release@25.0.9
      @semantic-release/changelog@7.0.0
      @semantic-release/exec@7.1.0
      @semantic-release/git@11.0.1
      @semantic-release/gitlab@13.3.3
      conventional-changelog-conventionalcommits@9.3.1
  script:
    # Lit .releaserc.yml ; utilise GITLAB_TOKEN (variable CI/CD masquée et
    # protégée) pour pousser le commit, l'étiquette et créer la Release
    - semantic-release
  # Bouton ▶ sur la branche principale seulement : on choisit QUAND publier ;
  # allow_failure : le pipeline reste vert tant qu'on ne l'a pas lancé
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
