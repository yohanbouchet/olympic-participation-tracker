# =============================================================================
# Fichier     : charts/olympic-tracker-chart/Chart.yaml
# Rôle        : carte d'identité du chart Helm du front Angular (Nginx)
# Utilisé par : helm lint / helm install (dossier charts/olympic-tracker-chart)
# =============================================================================
apiVersion: v2
name: olympic-tracker-chart
description: Olympic Participation Tracker (Angular front served by Nginx)
# "application" : le chart déploie une appli (≠ "library", boîte à outils)
type: application
# Version du CHART (à augmenter quand les templates changent)
version: 0.1.0
# Version de l'APPLICATION livrée (dernière release semantic-release)
appVersion: "0.1.4"
